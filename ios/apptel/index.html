<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OnScen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>OnScen</title>
  </head>
  <body>
    <div id="root">
      <div
        id="melosong-boot"
        style="
          min-height: 100dvh;
          min-height: -webkit-fill-available;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          background: #0b0b0f;
          color: #9ca3af;
          font-family: system-ui, sans-serif;
          text-align: center;
          padding: 1.5rem;
        "
      >
        <div
          style="
            width: 2rem;
            height: 2rem;
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: melosong-spin 0.8s linear infinite;
          "
        ></div>
        <p style="margin: 0; font-size: 0.95rem">Chargement de OnScen…</p>
        <p id="melosong-boot-hint" style="margin: 0; font-size: 0.75rem; color: #6b7280; max-width: 20rem">
          Si l’écran reste noir : <strong style="color: #c4b5fd">Ctrl+Shift+R</strong> (actualisation forcée)
        </p>
      </div>
    </div>
    <style>
      @keyframes melosong-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        var SW_CLEAR_KEY = 'melosong_sw_purge_v5';
        function purgePwaCaches() {
          if (!('serviceWorker' in navigator)) return Promise.resolve();
          return navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .then(function () {
              if (!window.caches) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            });
        }
        if (localStorage.getItem(SW_CLEAR_KEY) !== '1') {
          purgePwaCaches().finally(function () {
            localStorage.setItem(SW_CLEAR_KEY, '1');
          });
        }
        if (location.search.indexOf('clear-pwa=1') !== -1) {
          purgePwaCaches().then(function () {
            try {
              var u = new URL(location.href);
              u.searchParams.delete('clear-pwa');
              location.replace(u.pathname + u.search + u.hash);
            } catch (e) {
              location.reload();
            }
          });
        }
        window.addEventListener(
          'error',
          function (ev) {
            var t = ev.target;
            if (!t || t.tagName !== 'SCRIPT') return;
            var hint = document.getElementById('melosong-boot-hint');
            if (!hint) return;
            hint.innerHTML =
              'Le fichier JavaScript n’a pas pu se charger (souvent cache PWA ou mauvaise URL http/https). ' +
              'Fermez l’icône PWA, ouvrez le site dans Chrome, Edge ou Opera, puis <strong style="color:#c4b5fd">Ctrl+Shift+R</strong>.';
            hint.style.color = '#fca5a5';
          },
          true
        );
        setTimeout(function () {
          if (document.getElementById('melosong-boot')) {
            var hint = document.getElementById('melosong-boot-hint');
            if (hint && hint.style.color !== 'rgb(252, 165, 165)') {
              hint.textContent =
                'Toujours bloqué ? Ctrl+Shift+R sur http://localhost:4080 (navigateur, pas l’icône PWA).';
            }
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
