Pour l'avocat: 

Quelle assurance (RC pro, cyber, protection juridique) est pertinente pour une plateforme sociale + paiements ?
Faut-il nommer un DPO (interne, externe, délégué) compte tenu de la géoloc temps réel et des mineurs ?
Nos CGU / privacy / DPIA in-app suffisent-elles, ou faut-il les faire valider et signer avant prod ?
Les « pourboires » sont-ils juridiquement corrects (pas un don associatif, pas de reçu fiscal) — ou faut-il parler de prestation, gratification, cadeau numérique ?




Priorité 1 — Avant tout « vrai » lancement (paiements + stores)
1. Statut de la société et éditeur LCEN
Forme juridique (micro, SASU, SAS) et timing : avant prod publique, avant App Store, avant premiers paiements réels ?
Mentions légales complètes : SIREN/SIRET, siège social (domiciliation OK si cohérent Kbis), hébergeur (Scaleway), contact éditeur.
Hébergeur vs éditeur (LCEN / DSA) : avec modération admin, feed algorithmique, sponsors, lives UGC — quel statut et quelles obligations ça implique ?
OnScen a encore des points LCEN en cours (adresse, DPO) — c’est le premier sujet à verrouiller.

2. Monétisation : pourboires, Stripe, fiscalité
Vos « pourboires live » (30 % plateforme, pas de reçu fiscal) : cadre juridique correct (soutien créateur vs don vs prestation) et formulation CGU à valider.
Stripe Connect : KYC/AML, DAC7, TVA, facturation créateurs, responsabilité de la plateforme.
Remboursements : quand obligatoires, délais, litiges.
3. App mobile : règles Apple / Google (bloquant stores)
Stripe dans l’app iOS/Android pour dons/abos = rejet stores en principe → articulation web (Stripe) vs IAP Apple/Google.
Sign in with Apple obligatoire si Google OAuth est proposé sur iOS.
Contrats développeur Apple/Google, politique de contenu, âge de l’app.
Question clé pour l’avocat (Q15 de votre fiche) : si vous lancez demain avec pourboires réels + app iOS, quels 3 risques peuvent fermer l’app ou entraîner une sanction — et dans quel ordre les traiter ?

Priorité 2 — RGPD et données personnelles
OnScen collecte beaucoup de données sensibles : géoloc, DMs, lives vidéo, mineurs potentiels, analytics.

À valider avec l’avocat :

DPO : obligatoire ou non (géoloc temps réel, mineurs, vidéo) ?
Sous-traitants : Scaleway, Stripe, Cloudflare, LiveKit, Sightengine, Google (OAuth/YouTube) — contrats, clauses art. 28, transferts hors UE.
CGU / Privacy / DPIA in-app : suffisantes pour une mise en prod à échelle, ou relecture formelle recommandée ?
Durées de conservation : DMs, archives lives, logs, analytics — purges automatiques obligatoires ?
Cookies (auth, Stripe.js, YouTube) : CMP / bannière consentement ou autre base légale ?
Export et suppression de compte (déjà implémentés) : conformité du contenu exporté.
Priorité 2 — Contenus, modération, mineurs
DSA (Digital Services Act) : OnScen est concernée ? Signalement, transparence modération, point de contact légal.
Âges actuels (compte 13+, live 16+, paiement 18+) : conformes ? Consentement parental ? Signalement PHAROS ?
UGC + musique : YouTube en salon, uploads reels/compositions, ACRCloud — CGU de licence utilisateur suffisante ? Procédure droits d’auteur (notice-and-takedown, copyright@getsoundy.com).
NSFW (Sightengine) : responsabilité si contenu illégal passe le filtre.
Priorité 3 — Sponsors, B2B, propriété intellectuelle
Sponsors natifs (4 emplacements) : contrats types, clauses publicité, marques, secteurs réglementés (alcool, etc.).
OnScen Pro / lieux (si prévu) : responsabilité contenu, données clients lieux.
Brevet / innovation (salons sync, geo musique) : votre doc brevet rappelle qu’il faut un CPI/avocat PI avant dépôt — distinct du RDV « conformité lancement ».