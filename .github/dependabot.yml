version: 2
updates:
  # Chemins alignés sur la restructuration monorepo (web/ios/android/commun, commit
  # 72370fc8) — les anciens chemins "/app" et "/backend" ne correspondent plus à
  # aucun package.json depuis cette restructuration : Dependabot ne créait donc
  # silencieusement AUCUNE PR de mise à jour de dépendances pour ces packages.
  - package-ecosystem: "npm"
    directory: "/web/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "npm"
    directory: "/commun/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"

  # Mobile Capacitor (iOS/Android) — non couvert auparavant.
  - package-ecosystem: "npm"
    directory: "/ios/apptel"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "mobile"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "root"
