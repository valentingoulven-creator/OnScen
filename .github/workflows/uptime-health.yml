# Uptime externe — ping /health prod + staging (complète monitor-alerts.sh VPS)
# Les cron GitHub n'utilisent QUE la branche par défaut (master).
name: Uptime Health

on:
  schedule:
    # Toutes les 5 minutes (runners GitHub = point de vue externe)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET https://onscen.com/health
        run: |
          set +e
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 15 --max-time 30 https://onscen.com/health)
          curl_ec=$?
          set -e
          echo "HTTP ${code:-none} curl_exit=$curl_ec"
          cat /tmp/health.json 2>/dev/null || true
          test "$code" = "200"
          grep -q '"status"' /tmp/health.json

  staging:
    name: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET staging /health (DNS then IP)
        run: |
          set +e
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 15 --max-time 30 https://staging.onscen.com/health)
          curl_ec=$?
          set -e
          if [ "$code" != "200" ]; then
            echo "staging.onscen.com KO (HTTP ${code:-none} curl_exit=$curl_ec) — fallback http://51.159.170.181/health"
            set +e
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --connect-timeout 15 --max-time 30 http://51.159.170.181/health)
            curl_ec=$?
            set -e
          fi
          echo "HTTP ${code:-none} curl_exit=$curl_ec"
          cat /tmp/health.json 2>/dev/null || true
          test "$code" = "200"
          grep -q '"status"' /tmp/health.json
