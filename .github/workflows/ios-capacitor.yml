      #   env:
      #     APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS (unsigned archive — skeleton)
        run: |
          echo "Projet iOS prêt : ios/App/App.xcworkspace"
          echo "Configurez les secrets Apple puis décommentez l'étape xcodebuild."
          ls -la ios/App/
          # xcodebuild -workspace ios/App/App.xcworkspace \
