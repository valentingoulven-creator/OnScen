# OnScen — build iOS Capacitor dans le cloud (macOS)
# Compile unsigned (CODE_SIGNING_ALLOWED=NO) pour attraper les erreurs Xcode.
# Signature / IPA / TestFlight : décommenter les étapes secrets Apple.
#
# Secrets GitHub requis pour un export signé (Settings → Secrets and variables → Actions) :
#   APPLE_CERTIFICATE_BASE64       — certificat .p12 encodé en base64
#   APPLE_CERTIFICATE_PASSWORD     — mot de passe du .p12
#   APPLE_PROVISIONING_PROFILE_BASE64 — profil .mobileprovision en base64
#   KEYCHAIN_PASSWORD              — mot de passe keychain temporaire CI
#   APPLE_TEAM_ID                  — identifiant équipe Apple Developer (ne pas inventer)
#
# Compte Apple Developer (99 €/an) obligatoire pour installer hors Xcode local.
# Voir Smartphone/iOS-SANS-MAC-OPTIONS.txt

name: iOS Capacitor Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'ios/apptel/**'
      - 'web/app/**'
      - '.github/workflows/ios-capacitor.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios/apptel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/app/package-lock.json
            ios/apptel/package-lock.json

      - name: Install root dependencies (sync-lan scripts)
        working-directory: .
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Sync LAN env placeholder
        working-directory: .
        run: |
          mkdir -p commun/msdev
          if [ ! -f commun/msdev/.env ]; then
            echo "MOBILE_API_URL=http://127.0.0.1:4080/api" >> commun/msdev/.env
            echo "MOBILE_SOCKET_URL=http://127.0.0.1:4080" >> commun/msdev/.env
          fi

      - name: Install app dependencies (shared source fallbacks)
        working-directory: web/app
        run: npm ci

      - name: Install apptel dependencies
        run: npm ci

      - name: Sync marketing version from app-version.json
        run: node scripts/sync-app-version.mjs

      - name: Build Capacitor web assets (prod API)
        working-directory: .
        run: npm run capacitor:build:prod

      - name: Sync iOS project
        run: npx cap sync ios

      # --- Décommenter après ajout des secrets Apple ---
      #
      # - name: Import signing certificate
      #   env:
      #     APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERT_PATH=$RUNNER_TEMP/cert.p12
      #     echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security default-keychain -s build.keychain
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
      #     security import $CERT_PATH -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #
      # - name: Install provisioning profile
      #   env:
      #     APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      #   run: |
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS (unsigned compile check)
        run: |
          DEST='generic/platform=iOS'
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App -configuration Release \
              -destination "$DEST" \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild -project ios/App/App.xcodeproj \
              -scheme App -configuration Release \
              -destination "$DEST" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Upload iOS project artifact
        uses: actions/upload-artifact@v4
        with:
          name: onscen-ios-project
          path: ios/apptel/ios/
          if-no-files-found: warn
