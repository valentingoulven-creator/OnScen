# MeloSong — build iOS Capacitor dans le cloud (macOS)
# Déclenchement manuel jusqu'à configuration des secrets Apple.
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   APPLE_CERTIFICATE_BASE64       — certificat .p12 encodé en base64
#   APPLE_CERTIFICATE_PASSWORD     — mot de passe du .p12
#   APPLE_PROVISIONING_PROFILE_BASE64 — profil .mobileprovision en base64
#   KEYCHAIN_PASSWORD              — mot de passe keychain temporaire CI
#   APPLE_TEAM_ID                  — identifiant équipe Apple Developer
#
# Compte Apple Developer (99 €/an) obligatoire pour installer hors Xcode local.
# Voir Smartphone/iOS-SANS-MAC-OPTIONS.txt

name: iOS Capacitor Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'apptel/**'
      - 'app/**'
      - '.github/workflows/ios-capacitor.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apptel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apptel/package-lock.json

      - name: Install root dependencies (sync-lan scripts)
        working-directory: .
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Sync LAN env placeholder
        working-directory: .
        run: |
          mkdir -p msdev
          if [ ! -f msdev/.env ]; then
            echo "MOBILE_API_URL=http://127.0.0.1:4080/api" >> msdev/.env
            echo "MOBILE_SOCKET_URL=http://127.0.0.1:4080" >> msdev/.env
          fi

      - name: Install app dependencies (shared source fallbacks)
        working-directory: app
        run: npm ci

      - name: Install apptel dependencies
        run: npm ci

      - name: Build Capacitor web assets
        working-directory: .
        run: npm run build:capacitor --prefix apptel

      - name: Sync iOS project
        run: npx cap sync ios

      # --- Décommenter après ajout des secrets Apple ---
