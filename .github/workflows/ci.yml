# CI — build, lint, tests, E2E smoke contre staging (optionnel si flaky)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            commun/backend/package-lock.json
            web/app/package-lock.json

      - name: Backend — install & build
        working-directory: commun/backend
        run: |
          npm ci
          npm run build

      - name: Backend — lint
        working-directory: commun/backend
        run: npm run lint

      - name: Backend — tests
        working-directory: commun/backend
        run: npm test

      - name: App — install & typecheck
        working-directory: web/app
        run: |
          npm ci
          npx tsc -b --noEmit

      - name: App — lint
        working-directory: web/app
        run: npm run lint

      - name: App — production build
        working-directory: web/app
        env:
          VITE_APP_ENV: production
          VITE_WEB_APP_URL: https://onscen.com
        run: npm run build

      - name: App — unit tests
        working-directory: web/app
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install app + Playwright
        working-directory: web/app
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Resolve staging URL (DNS, else VPS IP)
        id: staging
        run: |
          set +e
          code=$(curl -sS -o /tmp/stg-health.json -w "%{http_code}" --connect-timeout 15 --max-time 25 https://staging.onscen.com/health)
          curl_ec=$?
          set -e
          if [ "$code" = "200" ] && grep -q '"status"' /tmp/stg-health.json 2>/dev/null; then
            echo "url=https://staging.onscen.com" >> "$GITHUB_OUTPUT"
            echo "staging.onscen.com OK"
          else
            echo "staging.onscen.com KO (HTTP ${code:-none} curl_exit=$curl_ec) — fallback http://51.159.170.181"
            echo "url=http://51.159.170.181" >> "$GITHUB_OUTPUT"
          fi

      - name: E2E smoke (health staging public — pas la prod)
        working-directory: web/app
        env:
          E2E_SKIP_SERVER: '1'
          E2E_BASE_URL: ${{ steps.staging.outputs.url }}
          E2E_API_URL: ${{ steps.staging.outputs.url }}
        run: npm run test:e2e
