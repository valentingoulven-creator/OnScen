# CI — build, tests, E2E smoke (optionnel si flaky)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            commun/backend/package-lock.json
            web/app/package-lock.json

      - name: Backend — install & build
        working-directory: commun/backend
        run: |
          npm ci
          npm run build

      - name: Backend — tests
        working-directory: commun/backend
        run: npm test

      - name: App — install & typecheck
        working-directory: web/app
        run: |
          npm ci
          npx tsc -b --noEmit

      - name: App — lint
        working-directory: web/app
        run: npm run lint

      - name: App — production build
        working-directory: web/app
        env:
          VITE_APP_ENV: production
          VITE_WEB_APP_URL: https://getsoundy.com
        run: npm run build

      - name: App — unit tests
        working-directory: web/app
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install app + Playwright
        working-directory: web/app
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: E2E smoke (health prod public)
        working-directory: web/app
        env:
          E2E_SKIP_SERVER: '1'
          E2E_BASE_URL: https://getsoundy.com
          E2E_API_URL: https://getsoundy.com
        run: npm run test:e2e
